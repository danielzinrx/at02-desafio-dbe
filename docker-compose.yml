services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crudalunos
    ports:
      - "3307:3306"
    volumes:
      - ./crudalunos.sql:/docker-entrypoint-initdb.d/crudalunos.sql
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor:
    build: ./servidor
    restart: always
    environment:
      DB_HOST: db
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: always
    stdin_open: true
    tty: true
    environment:
      CI: "true"
    ports:
      - "3000:3000"
    depends_on:
      - servidor

volumes:
  dbdata: